packages:
  - shared
  - entry
  - profile

# Make pnpm enforce its 24-hour supply-chain quarantine during both fresh
# resolution and lockfile verification. This prevents Dependabot-generated
# lockfiles from admitting a newer transitive release than the reviewed update.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

catalog:
  # Runtime deps
  bits-ui: ^2.19.0
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tailwind-variants: ^3.3.1

  # Dev deps
  "@sveltejs/adapter-static": ^3.0.8
  "@sveltejs/kit": ^2.70.3
  "@sveltejs/vite-plugin-svelte": ^7.3.0
  "@tailwindcss/vite": ^4.3.0
  "@types/node": ^26.4.0
  "@inlang/paraglide-js": ^2.25.0
  svelte: ^5.56.10
  svelte-check: ^4.7.6
  tailwindcss: ^4.3.0
  typescript: ^6.0.0
  vite: ^8.2.2

onlyBuiltDependencies:
  - esbuild
