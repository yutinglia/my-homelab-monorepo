packages:
  - shared
  - entry
  - profile

# Make pnpm enforce its 24-hour supply-chain quarantine during both fresh
# resolution and lockfile verification. This prevents Dependabot-generated
# lockfiles from admitting a newer transitive release than the reviewed update.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true

catalog:
  # Runtime deps
  bits-ui: ^2.20.6
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwind-variants: ^3.3.1

  # Dev deps
  "@sveltejs/adapter-static": ^3.0.8
  "@sveltejs/kit": ^2.70.3
  "@sveltejs/vite-plugin-svelte": ^7.3.1
  "@tailwindcss/vite": ^4.3.4
  "@types/node": ^26.6.6
  "@inlang/paraglide-js": ^3.2.0
  svelte: ^5.57.3
  svelte-check: ^4.7.8
  tailwindcss: ^4.3.4
  typescript: ^6.0.0
  vite: ^8.3.6

onlyBuiltDependencies:
  - esbuild
