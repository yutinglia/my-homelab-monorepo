name: Build & Deploy to Homelab

on:
  push:
    branches: [main]
    paths:
      - 'apps/svelte_projects/**'
      - 'scripts/check-secrets.mjs'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    # Only allow deploys from the canonical repo, not forks
    if: >-
      github.repository == 'yutinglia/my-homelab-monorepo' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scan worktree and Git history
        run: node scripts/check-secrets.mjs --self-test --history

      - name: Build entry Docker image
        working-directory: apps/svelte_projects
        run: docker build -t homelab/entry:latest -f entry/Dockerfile .

      - name: Build profile Docker image
        working-directory: apps/svelte_projects
        run: docker build -t homelab/profile:latest -f profile/Dockerfile .

      - name: Verify build artifacts
        run: |
          for app in entry profile; do
            html="/usr/share/nginx/html/index.html"
            docker run --rm homelab/$app:latest sh -c "test -f $html && head -1 $html | grep -q '<!doctype html>'" \
              || { echo "::error::$app image missing or invalid index.html"; exit 1; }
            echo "✓ $app index.html OK"
          done

      - name: Deploy entry
        run: |
          cd ~/services/entry
          docker compose up -d

      - name: Deploy profile
        run: |
          cd ~/services/profile
          docker compose up -d
