name: Dependabot auto-merge

on:
  workflow_run:
    workflows:
      - Pull request checks
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Approve eligible updates and enable auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.repository == 'yutinglia/my-homelab-monorepo' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      # This privileged workflow never checks out PR code, restores PR caches,
      # or downloads artifacts produced by the unprivileged PR workflow.
      - name: Verify Dependabot PR and evaluate update policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "eligible=false" >> "$GITHUB_OUTPUT"

          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          author="$(jq -r '.user.login' <<< "$pr_json")"
          base_ref="$(jq -r '.base.ref' <<< "$pr_json")"
          draft="$(jq -r '.draft' <<< "$pr_json")"
          head_ref="$(jq -r '.head.ref' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"
          pr_state="$(jq -r '.state' <<< "$pr_json")"
          pr_url="$(jq -r '.html_url' <<< "$pr_json")"

          if [[ "$author" != "dependabot[bot]" ||
                "$base_ref" != "main" ||
                "$draft" != "false" ||
                "$head_repo" != "$REPOSITORY" ||
                "$pr_state" != "open" ]]; then
            echo "Pull request is not an eligible Dependabot PR targeting main."
            exit 0
          fi

          commits_json="$(
            gh api --paginate \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" \
              --slurp
          )"
          if ! jq -e '
            [.[][]] |
            length > 0 and
            all(.[];
              .author.login == "dependabot[bot]" and
              .commit.verification.verified == true
            )
          ' <<< "$commits_json" > /dev/null; then
            echo "Not every pull request commit is verified as Dependabot-authored."
            exit 0
          fi

          case "$head_ref" in
            dependabot/*/automerge-minor-patch*)
              reason="grouped minor or patch update"
              ;;
            dependabot/*/automerge-security*)
              reason="grouped security update"
              ;;
            *)
              echo "Dependabot policy: manual review required."
              exit 0
              ;;
          esac

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Dependabot policy: $reason."

      - name: Approve eligible update
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.policy.outputs.pr_url }}
        run: |
          review_decision="$(gh pr view "$PR_URL" --json reviewDecision --jq .reviewDecision)"
          if [[ "$review_decision" == "APPROVED" ]]; then
            echo "Pull request is already approved."
          else
            gh pr review --approve "$PR_URL"
          fi

      - name: Enable squash auto-merge for eligible update
        if: steps.policy.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.policy.outputs.pr_url }}
        run: |
          auto_merge_enabled="$(
            gh pr view "$PR_URL" --json autoMergeRequest \
              --jq '.autoMergeRequest != null'
          )"
          if [[ "$auto_merge_enabled" == "true" ]]; then
            echo "Auto-merge is already enabled."
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
